apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ambient-api-server-route
  labels:
    app: ambient-api-server
spec:
  to:
    kind: Service
    name: ambient-api-server
    weight: 100
  port:
    targetPort: api
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
