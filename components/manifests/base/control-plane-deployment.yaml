apiVersion: apps/v1
kind: Deployment
metadata:
  name: ambient-control-plane
  labels:
    app: ambient-control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ambient-control-plane
  template:
    metadata:
      labels:
        app: ambient-control-plane
    spec:
      serviceAccountName: ambient-control-plane
      containers:
      - name: ambient-control-plane
        image: quay.io/ambient_code/vteam_control_plane:latest
        imagePullPolicy: Always
        env:
        - name: AMBIENT_API_SERVER_URL
          value: "http://ambient-api-server.myproject.svc:8000"
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POLL_INTERVAL_SECONDS
          value: "5"
        - name: WORKER_COUNT
          value: "2"
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      restartPolicy: Always
